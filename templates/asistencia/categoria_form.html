{% extends 'base.html' %}
{% block title %}{{ 'Editar' if categoria else 'Nueva' }} Categoría{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('asistencia_categorias') }}" class="btn btn-outline-secondary btn-sm me-3">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h3 class="mb-0">
          <i class="bi bi-tags-fill text-primary me-2"></i>
          {{ 'Editar Categoría' if categoria else 'Nueva Categoría' }}
        </h3>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
              <input type="text" name="nombre" class="form-control"
                     value="{{ categoria.nombre if categoria else '' }}"
                     placeholder="Ej: Preuniversitario, Policía, Militar..." required autofocus>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea name="descripcion" class="form-control" rows="3"
                        placeholder="Descripción opcional...">{{ categoria.descripcion if categoria else '' }}</textarea>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill">
                <i class="bi bi-check-circle-fill me-1"></i>
                {{ 'Guardar cambios' if categoria else 'Crear categoría' }}
              </button>
              <a href="{{ url_for('asistencia_categorias') }}" class="btn btn-outline-secondary">
                Cancelar
              </a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
